<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0f766e" />
    <meta name="description" content="Ghi lại bữa ăn bằng giọng nói và gợi ý khẩu phần cho người tập gym." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Gym Dinh dưỡng" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icon-192.png" />
    <title>Gym Dinh dưỡng</title>
  </head>
  <body>
    <header class="topbar">
      <h1>Dinh dưỡng hôm nay</h1>
      <p id="today-label" class="muted"></p>
    </header>
    <main id="app"></main>
    <nav class="tabbar" aria-label="Điều hướng">
      <button data-tab="today" class="active">🍽️<span>Hôm nay</span></button>
      <button data-tab="history">📅<span>Lịch sử</span></button>
      <button data-tab="settings">⚙️<span>Cài đặt</span></button>
    </nav>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
